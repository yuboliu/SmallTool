ltm node /Common/node_web1 {
    address 10.0.0.1
}
ltm node /Common/node_web2 {
    address 10.0.0.2
}
ltm pool /Common/pool_web {
    members {
        /Common/node_web1:80 {
            address 10.0.0.1
        }
        /Common/node_web2:80 {
            address 10.0.0.2
        }
    }
    monitor /Common/mon_http
    load-balancing-mode round-robin
}
ltm pool /Common/pool_empty {
    load-balancing-mode least-connections-member
}
ltm virtual-address /Common/va_web {
    address 192.168.1.10
    arp enabled
    icmp-echo enabled
    mask 255.255.255.255
    traffic-group /Common/traffic-group-1
}
ltm virtual /Common/vs_web {
    destination /Common/va_web:80
    description "Web virtual server"
    ip-protocol tcp
    mask 255.255.255.255
    persist {
        /Common/persist_src { }
    }
    pool /Common/pool_web
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/rule_redirect
    }
    source 0.0.0.0/0
    source-address-translation {
        type automap
    }
    translate-address enabled
    translate-port enabled
}
ltm monitor http /Common/mon_http {
    adaptive disabled
    defaults-from /Common/http
    destination *:*
    interval 5
    ip-dscp 0
    recv "200 OK"
    recv-disable none
    send "GET / HTTP/1.0\r\n\r\n"
    time-until-up 0
    timeout 16
}
ltm profile client-ssl /Common/ssl_web {
    cert /Common/web.crt
    chain /Common/chain.crt
    ciphers DEFAULT
    defaults-from /Common/clientssl
    key /Common/web.key
}
ltm persistence source-addr /Common/persist_src {
    defaults-from /Common/source_addr
    mask 255.255.255.255
    timeout 180
}
ltm rule /Common/rule_redirect {
    when HTTP_REQUEST {
        if { [HTTP::host] equals "old.example.com" } {
            HTTP::redirect "https://new.example.com"
        }
    }
}
